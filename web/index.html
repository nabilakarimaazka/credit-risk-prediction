<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Risk Scoring</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #1e3a8a;
      --brand-2: #2563eb;
      --low: #16a34a;
      --medium: #d97706;
      --high: #ea580c;
      --veryhigh: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    /* Header */
    .header {
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      color: white;
      padding: 28px 24px 72px;
    }
    .header-isi { max-width: 1080px; margin: auto; }
    .header h1 { margin: 0 0 6px; font-size: 28px; }
    .header p { margin: 0; opacity: 0.85; }

    /* Layout */
    .utama {
      max-width: 1080px;
      margin: -48px auto 40px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      align-items: start;
    }
    .kartu {
      background: var(--card);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(17, 24, 39, 0.06);
    }

    /* Formulir */
    .bagian { margin-bottom: 22px; }
    .bagian h3 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--brand-2);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      font-family: inherit;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafafa;
      transition: border-color 0.15s, background 0.15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--brand-2); background: white; }
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: var(--brand-2);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: var(--brand); }
    button:disabled { opacity: 0.6; cursor: wait; }

    /* Panel hasil */
    .panel { position: sticky; top: 20px; }
    .kosong { color: var(--muted); text-align: center; padding: 40px 10px; }
    .kosong .ikon { font-size: 40px; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }
    .skor-besar { font-size: 44px; font-weight: 700; margin: 14px 0 2px; }
    .skor-label { color: var(--muted); font-size: 13px; }

    .gauge { position: relative; margin: 22px 0 8px; }
    .gauge-bar {
      display: flex;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
    }
    .gauge-bar div { height: 100%; }
    .penanda {
      position: absolute;
      top: -6px;
      width: 4px;
      height: 24px;
      background: var(--ink);
      border-radius: 2px;
      transform: translateX(-2px);
      transition: left 0.4s ease;
    }
    .garis-threshold {
      position: absolute;
      top: -4px;
      height: 20px;
      border-left: 2px dashed var(--ink);
      opacity: 0.45;
    }
    .gauge-label { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
    .gauge-label span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
    .gauge-label span:first-child { transform: none; }
    .gauge-label span:last-child { transform: translateX(-100%); }

    .baris {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }
    .baris span:first-child { color: var(--muted); }
    .baris span:last-child { font-weight: 600; text-align: right; }
    .tindakan {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }
    .error-box { background: #fee2e2; color: #991b1b; padding: 16px; border-radius: 10px; }
    .error-box ul { margin: 8px 0 0; padding-left: 18px; }

    .catatan { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.5; }

    @media (max-width: 860px) {
      .utama { grid-template-columns: 1fr; }
      .panel { position: static; }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-isi">
      <h1>Credit Risk Scoring</h1>
      <p>Perkirakan risiko gagal bayar peminjam dan dapatkan rekomendasi tindakan.</p>
    </div>
  </header>

  <main class="utama">
    <form id="formulir" class="kartu">
      <div class="bagian">
        <h3>Profil peminjam</h3>
        <div class="grid">
          <div>
            <label>Usia (tahun)</label>
            <input type="number" name="person_age" value="30" required>
          </div>
          <div>
            <label>Pendapatan per tahun</label>
            <input type="number" name="person_income" value="50000" required>
          </div>
          <div>
            <label>Status tempat tinggal</label>
            <select name="person_home_ownership">
              <option value="RENT">Sewa (RENT)</option>
              <option value="OWN">Milik sendiri (OWN)</option>
              <option value="MORTGAGE">KPR (MORTGAGE)</option>
              <option value="OTHER">Lainnya (OTHER)</option>
            </select>
          </div>
          <div>
            <label>Lama bekerja (tahun, boleh kosong)</label>
            <input type="number" step="0.1" name="person_emp_length" placeholder="misal 3">
          </div>
        </div>
      </div>

      <div class="bagian">
        <h3>Detail pinjaman</h3>
        <div class="grid">
          <div>
            <label>Tujuan pinjaman</label>
            <select name="loan_intent">
              <option value="PERSONAL">Pribadi (PERSONAL)</option>
              <option value="EDUCATION">Pendidikan (EDUCATION)</option>
              <option value="MEDICAL">Kesehatan (MEDICAL)</option>
              <option value="VENTURE">Usaha (VENTURE)</option>
              <option value="HOMEIMPROVEMENT">Renovasi rumah (HOMEIMPROVEMENT)</option>
              <option value="DEBTCONSOLIDATION">Gabung utang (DEBTCONSOLIDATION)</option>
            </select>
          </div>
          <div>
            <label>Grade pinjaman</label>
            <select name="loan_grade">
              <option>A</option><option>B</option><option selected>C</option>
              <option>D</option><option>E</option><option>F</option><option>G</option>
            </select>
          </div>
          <div>
            <label>Jumlah pinjaman</label>
            <input type="number" name="loan_amnt" value="10000" required>
          </div>
          <div>
            <label>Suku bunga (%, boleh kosong)</label>
            <input type="number" step="0.01" name="loan_int_rate" value="13.5">
          </div>
        </div>
      </div>

      <div class="bagian">
        <h3>Riwayat kredit</h3>
        <div class="grid">
          <div>
            <label>Pernah gagal bayar sebelumnya?</label>
            <select name="cb_person_default_on_file">
              <option value="N">Tidak</option>
              <option value="Y">Ya</option>
            </select>
          </div>
          <div>
            <label>Panjang riwayat kredit (tahun)</label>
            <input type="number" name="cb_person_cred_hist_length" value="4" required>
          </div>
        </div>
      </div>

      <button type="submit" id="tombol">Hitung risiko</button>
    </form>

    <aside class="kartu panel" id="hasil">
      <div class="kosong">
        <div class="ikon">&#9878;</div>
        <div>Hasil penilaian akan muncul di sini.</div>
      </div>
    </aside>
  </main>

  <script>
    const formulir = document.getElementById("formulir");
    const kotakHasil = document.getElementById("hasil");
    const tombol = document.getElementById("tombol");

    const KOLOM_ANGKA = ["person_age", "person_income", "person_emp_length",
                         "loan_amnt", "loan_int_rate", "cb_person_cred_hist_length"];

    // warna tiap tier (sama dengan variabel CSS di atas)
    const WARNA_TIER = {
      "Low Risk": "var(--low)",
      "Medium Risk": "var(--medium)",
      "High Risk": "var(--high)",
      "Very High Risk": "var(--veryhigh)",
    };
    const LATAR_TIER = {
      "Low Risk": "#dcfce7",
      "Medium Risk": "#fef3c7",
      "High Risk": "#ffedd5",
      "Very High Risk": "#fee2e2",
    };

    // batas tier, sama dengan scoring_config: 0,24 / 0,50 / 0,80
    const BATAS = [0, 0.24, 0.5, 0.8, 1];
    const URUTAN_TIER = ["Low Risk", "Medium Risk", "High Risk", "Very High Risk"];

    function buatGauge(skor) {
      const potongan = URUTAN_TIER.map((tier, i) => {
        const lebar = (BATAS[i + 1] - BATAS[i]) * 100;
        return `<div style="width:${lebar}%; background:${WARNA_TIER[tier]}"></div>`;
      }).join("");
      return `
        <div class="gauge">
          <div class="gauge-bar">${potongan}</div>
          <div class="garis-threshold" style="left:${BATAS[1] * 100}%" title="Threshold 0,24"></div>
          <div class="penanda" style="left:${skor * 100}%"></div>
        </div>
        <div class="gauge-label">
          <span style="left:0%">0</span>
          <span style="left:24%">0,24</span>
          <span style="left:50%">0,5</span>
          <span style="left:80%">0,8</span>
          <span style="left:100%">1</span>
        </div>
      `;
    }

    formulir.addEventListener("submit", async function (event) {
      event.preventDefault();

      // 1. Kumpulkan isian formulir
      const data = Object.fromEntries(new FormData(formulir));
      for (const kolom of KOLOM_ANGKA) {
        data[kolom] = data[kolom] === "" ? null : Number(data[kolom]);
      }

      tombol.disabled = true;
      tombol.textContent = "Menghitung...";

      try {
        // 2. Kirim ke API
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const jawaban = await response.json();

        // 3. Tampilkan hasil
        if (response.ok) {
          const tier = jawaban.risk_tier;
          kotakHasil.innerHTML = `
            <span class="badge" style="background:${WARNA_TIER[tier]}">${tier}</span>
            <div class="skor-besar">${jawaban.skor_risiko.toFixed(2)}</div>
            <div class="skor-label">Skor risiko (0 = sangat aman, 1 = sangat berisiko)</div>
            ${buatGauge(jawaban.skor_risiko)}
            <div style="margin-top:18px">
              <div class="baris"><span>Keputusan</span><span>${jawaban.keputusan}</span></div>
              <div class="baris"><span>Perkiraan peluang gagal bayar</span><span>${(jawaban.perkiraan_peluang * 100).toFixed(1)}%</span></div>
            </div>
            <div class="tindakan" style="background:${LATAR_TIER[tier]}">
              <b>Tindakan yang disarankan</b><br>${jawaban.tindakan}
            </div>
            <div class="catatan">
              Skor dari model CatBoost. Peminjam dengan skor di atas 0,24 ditandai untuk ditinjau
              (threshold dipilih untuk meminimalkan biaya kesalahan).
            </div>
          `;
        } else {
          const pesan = jawaban.detail.map(e => `<li>${e.loc[1]}: ${e.msg}</li>`).join("");
          kotakHasil.innerHTML = `<div class="error-box"><b>Data belum valid</b><ul>${pesan}</ul></div>`;
        }
      } catch (err) {
        kotakHasil.innerHTML = `<div class="error-box"><b>Tidak bisa terhubung ke API.</b><br>Pastikan uvicorn sedang berjalan.</div>`;
      } finally {
        tombol.disabled = false;
        tombol.textContent = "Hitung risiko";
      }
    });
  </script>
</body>
</html>
